apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aviation.ai                
  namespace: argocd             
spec:
  project: default              
  source:
    repoURL: https://github.com/bajaj-varun/aviation-ai-platform.git   
    targetRevision: main        
    path: argocd/scripts   
  destination:
    server: https://kubernetes.default.svc  
    namespace: aviation.ai             
  syncPolicy:
    automated:
      prune: true                 
      selfHeal: true              